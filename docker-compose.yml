# ─── Docker Compose для Smart Scraper Platform ───
# Поднимает всю платформу: бэкенд, фронт, базу, редис и nginx.
# Postgres и Redis без внешних портов — только внутренняя сеть (безопасненько).

services:

  # ─── PostgreSQL — основная база данных ───
  postgres:
    image: postgres:16-alpine
    container_name: ssp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_scraper}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # порт наружу не пробрасываем — только внутренняя сеть
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_scraper}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ssp-network

  # ─── Redis — кэш и очереди задач ───
  redis:
    image: redis:7-alpine
    container_name: ssp-redis
    restart: unless-stopped
    # порт тоже только внутренний — не светим наружу
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ssp-network

  # ─── Backend — FastAPI приложение ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssp-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # переопределяем URL-ы чтоб ходили по внутренней сети докера
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_scraper}
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ssp-network

  # ─── Frontend — React/Vite приложение ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssp-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - ssp-network

  # ─── Nginx — реверс-прокси, точка входа ───
  nginx:
    image: nginx:alpine
    container_name: ssp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # подсовываем наш конфиг вместо дефолтного
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # статику фронта тянем из контейнера frontend
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - ssp-network

# ─── Тома для персистентных данных ───
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ─── Внутренняя сеть — все сервисы общаются тут ───
networks:
  ssp-network:
    driver: bridge
