# ─── Nginx конфиг для Smart Scraper Platform ───
# Реверс-прокси: раздает фронт и проксирует API на бэкенд.
# Тут же живут заголовки безопасности и gzip.

worker_processes auto;

events {
    # сколько соединений на один воркер — для начала хватит
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ─── Логирование ───
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Базовые оптимизации ───
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ─── Gzip — жмем всё что можно, экономим трафик ───
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ─── Основной сервер ───
    server {
        listen 80;
        server_name _;

        # ─── Заголовки безопасности ───
        # не даем браузеру угадывать content-type
        add_header X-Content-Type-Options "nosniff" always;
        # запрещаем встраивание в iframe (защита от clickjacking)
        add_header X-Frame-Options "DENY" always;
        # XSS-фильтр (для старых браузеров)
        add_header X-XSS-Protection "1; mode=block" always;
        # реферер только на свой домен
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS — принудительный HTTPS (раскомментировать когда будет SSL)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP — базовая политика, можно ужесточить под проект
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self';" always;

        # ─── API — проксируем на бэкенд ───
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # таймауты для долгих запросов (скрапинг может быть не быстрым)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ─── Swagger/OpenAPI — в проде лучше закрыть ───
        # Раскомментировать для разработки:
        # location /docs {
        #     proxy_pass http://backend:8000/docs;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
        # location /redoc {
        #     proxy_pass http://backend:8000/redoc;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        # }
        # location /openapi.json {
        #     proxy_pass http://backend:8000/openapi.json;
        #     proxy_set_header Host $host;
        # }

        # ─── Фронтенд — статика ───
        location / {
            root /usr/share/nginx/html;
            index index.html;

            # SPA-роутинг: если файл не найден — отдаем index.html
            try_files $uri $uri/ /index.html;
        }

        # ─── Кэширование статики ───
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
