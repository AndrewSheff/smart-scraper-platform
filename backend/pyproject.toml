[project]
name = "smart-scraper-platform"
version = "1.0.0"
description = "Business monitoring platform with scheduled scraping, AI summaries and Telegram notifications"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101", "B008", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/config.py" = ["S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
